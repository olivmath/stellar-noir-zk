[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.dependencies]
soroban-sdk = "23.5.1"

[profile.release]
opt-level = "z"
overflow-checks = false
debug = false
lto = true
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1

[profile.release-with-logs]
inherits = "release"
debug-assertions = true